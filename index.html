<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CHATX</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;--bg:#fff;--bg2:#f4f6f5;--tx:#111b21;--tx2:#667781;--g:#10b36b;--g2:#0a8f55;--gl:#e3f7ed;--out:#dcf8e6;--in:#fff;--bd:#e6ebe9;--wp:#eef3f0;--sh:0 8px 30px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--bg2:#17211e;--tx:#e8f0ed;--tx2:#8fa39b;--gl:#143828;--out:#0f4a32;--in:#1b2724;--bd:#25322e;--wp:#0b1210;--sh:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0e1614;--bg2:#17211e;--tx:#e8f0ed;--tx2:#8fa39b;--gl:#143828;--out:#0f4a32;--in:#1b2724;--bd:#25322e;--wp:#0b1210;--sh:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:0;width:100%}input:focus,textarea:focus{border-color:var(--g)}
.btn{background:var(--g);color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;transition:.2s}.btn:hover{background:var(--g2)}.btn.s{background:var(--bg2);color:var(--tx)}.btn.d{background:#e5484d}.btn:disabled{opacity:.5}
.app{display:flex;height:100%;max-width:1400px;margin:auto}#side{width:390px;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--bg)}#main{flex:1;display:flex;flex-direction:column;background:var(--wp);min-width:0}
@media(max-width:760px){#side{width:100%}.app.op #side{display:none}.app:not(.op) #main{display:none}}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.logo{font-weight:800;font-size:22px;color:var(--g);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}.logo i{width:26px;height:26px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
#pane{flex:1;overflow:auto}#nav{display:flex;border-top:1px solid var(--bd)}#nav button{flex:1;padding:10px 0 8px;font-size:11px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}#nav button b{font-size:19px;font-weight:400}#nav .on{color:var(--g);font-weight:600}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;transition:background .15s;animation:in .25s}.row:hover,.row.on{background:var(--bg2)}.row .m{flex:1;min-width:0}.row .n{font-weight:600;display:flex;justify-content:space-between;gap:8px}.row small{color:var(--tx2);font-weight:400;font-size:12px}.row .p{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:8px}
.bd{background:var(--g);color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 6px}
.av{border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden;position:relative}.av img{width:100%;height:100%;object-fit:cover}.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--g)}
.on-dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#25d366;border:2px solid var(--bg)}
.fab{position:absolute;right:18px;bottom:78px;width:54px;height:54px;border-radius:18px;background:var(--g);color:#fff;font-size:26px;box-shadow:var(--sh);transition:.2s}.fab:hover{transform:scale(1.07)}#side{position:relative}
.sec{padding:14px 16px 4px;color:var(--tx2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}.emp{text-align:center;color:var(--tx2);padding:50px 24px}.emp b{display:block;font-size:44px;margin-bottom:6px}
.sr{padding:0 16px 8px}
#chat{display:none;flex-direction:column;height:100%}.op #chat{display:flex}.op #empty{display:none}#empty{margin:auto;text-align:center;color:var(--tx2);padding:20px}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}.ch .m{flex:1;min-width:0;cursor:pointer}.ch .m div{font-weight:600}.ch .m small{color:var(--tx2)}.ic{width:38px;height:38px;border-radius:50%;font-size:18px;transition:.15s}.ic:hover{background:var(--bg2)}
#msgs{flex:1;overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:var(--wp)}
.b{max-width:min(78%,520px);padding:7px 10px 5px;border-radius:14px;background:var(--in);box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative;word-wrap:break-word;animation:pop .2s;align-self:flex-start;white-space:pre-wrap}.b.me{background:var(--out);align-self:flex-end}
.b .who{font-size:12px;font-weight:700;color:var(--g)}.b .t{font-size:10.5px;color:var(--tx2);text-align:right;margin-top:2px;white-space:nowrap}.b .tk{color:var(--tx2)}.b .tk.r{color:#2f9bff}.b .x{position:absolute;top:2px;right:4px;opacity:0;font-size:12px;color:var(--tx2)}.b:hover .x{opacity:1}
.b img,.b video{max-width:100%;border-radius:10px;display:block;margin-bottom:3px}.b audio{max-width:230px;height:36px}.q{border-left:3px solid var(--g);background:rgba(0,0,0,.06);border-radius:6px;padding:3px 7px;margin-bottom:4px;font-size:13px;color:var(--tx2)}.rx{position:absolute;bottom:-12px;right:8px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;font-size:12px;padding:0 5px}.b.hr{margin-bottom:12px}.del{font-style:italic;color:var(--tx2)}.doc{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.06);padding:8px;border-radius:8px;color:inherit;text-decoration:none}.day{align-self:center;background:var(--bg);color:var(--tx2);font-size:12px;border-radius:8px;padding:2px 10px;margin:6px 0}
#bar{display:none;padding:6px 14px;background:var(--bg);border-top:1px solid var(--bd);font-size:13px;color:var(--tx2);justify-content:space-between}
.cp{display:flex;gap:6px;align-items:flex-end;padding:8px;background:var(--bg);border-top:1px solid var(--bd)}.cp textarea{flex:1;resize:none;max-height:100px;border-radius:20px}#send{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;font-size:18px;flex:none}#send.rec{background:#e5484d;animation:pulse 1s infinite}
#emo{display:none;grid-template-columns:repeat(10,1fr);gap:2px;padding:8px;background:var(--bg);border-top:1px solid var(--bd);font-size:22px;text-align:center}#emo span{cursor:pointer;border-radius:8px}#emo span:hover{background:var(--bg2)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .2s}.card{background:var(--bg);border-radius:20px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow:auto;box-shadow:var(--sh);animation:pop .22s}.card h3{margin:0 0 12px}.card .row{padding-left:6px;padding-right:6px}.gap>*{margin-bottom:10px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-90px);background:#111b21;color:#fff;border-radius:12px;padding:10px 16px;z-index:99;transition:.3s;max-width:90%;box-shadow:var(--sh)}#toast.s{transform:translateX(-50%)}
#auth{position:fixed;inset:0;background:linear-gradient(160deg,var(--gl),var(--bg) 55%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40;overflow:auto}#auth .card{max-width:380px;text-align:center}#auth .logo{justify-content:center;font-size:34px;margin-bottom:4px}
#call{position:fixed;inset:0;background:#0b1210;color:#fff;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.95}#lv{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:100px;border-radius:12px;background:#000;z-index:2}#call .z{position:relative;z-index:2}.cb{display:flex;gap:16px;position:relative;z-index:2}.cb button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.2);font-size:22px;color:#fff}.cb .red{background:#e5484d}.cb .grn{background:#25d366}
.st{position:fixed;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center;color:#fff;font-size:26px;text-align:center;padding:30px}.st img,.st video{max-width:100%;max-height:100%}.sw{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.sw .on{border-color:var(--tx)}
.tg{width:44px;height:26px;border-radius:99px;background:var(--bd);position:relative;flex:none;transition:.2s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--g)}.tg.on::after{left:21px}
@keyframes pop{from{transform:scale(.94);opacity:0}}@keyframes in{from{transform:translateY(6px);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes pulse{50%{opacity:.6}}
</style></head><body>
<div id="auth"></div>
<div class="app" id="app" hidden>
<section id="side"><div class="top"><div class="logo"><i>✦</i>CHATX</div><button class="ic" onclick="newChat()" title="New chat">✎</button></div><div id="pane"></div><button class="fab" id="fab" onclick="tab=='contacts'?contactForm():newChat()">+</button><nav id="nav"></nav></section>
<section id="main"><div id="empty"><div style="font-size:54px">💬</div><h2 style="color:var(--tx);margin:6px">CHATX</h2>Select a chat to start messaging.<br>Open this page in a second tab to chat live.</div>
<div id="chat"><div class="ch"><button class="ic" onclick="closeChat()">←</button><div id="hav"></div><div class="m" id="hm" onclick="info()"></div><button class="ic" onclick="startCall(0,false)" title="Audio call">📞</button><button class="ic" onclick="startCall(0,true)" title="Video call">🎥</button><button class="ic" onclick="menu()">⋮</button></div>
<div id="msgs"></div><div id="bar"><span id="bt"></span><button onclick="clr()">✕</button></div><div id="emo"></div>
<div class="cp"><button class="ic" onclick="$('#emo').style.display=$('#emo').style.display=='grid'?'none':'grid'">😊</button><button class="ic" onclick="$('#fi').click()">📎</button><input type="file" id="fi" hidden onchange="attach(this)"><textarea id="inp" rows="1" placeholder="Message" oninput="typing()" onkeydown="if(event.key=='Enter'&&!event.shiftKey&&innerWidth>760){event.preventDefault();go()}"></textarea><button id="send" onclick="go()">➤</button></div></div></section></div>
<div id="modal" onclick="if(event.target==this)mod()"></div><div id="toast"></div>
<div id="call"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div class="z"><div class="av" id="cav" style="width:96px;height:96px;margin:auto;font-size:38px"></div><h2 id="cn" style="margin:10px 0 2px"></h2><div id="cs"></div></div><div class="cb" id="cbt"></div></div>
<div class="st" id="stv" onclick="nextSt()"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,10);
const K='chatx_db';let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||{users:{},chats:{},status:[],calls:[],reports:[],cfg:{signups:true}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Storage full. Use a smaller file.')}};
let me=null;try{me=sessionStorage.getItem('chatx_me')}catch(e){}
let tab='chats',open=null,st={},q='',tmo;const EM=Array.from('😀😂😍🥰😎🤔😢😡👍👎🙏👏🔥🎉❤️💯✅👀🤝💪😴🤯😭🙌✨🌍🍕☕🎶🚀');
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='s';clearTimeout(tmo);tmo=setTimeout(()=>e.className='',3200)};
const U=p=>db.users[p]||{name:p,phone:p},mod=h=>{const m=$('#modal');m.style.display=h?'flex':'none';m.innerHTML=h?`<div class="card">${h}</div>`:''};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const av=(o,z=46,dot)=>`<div class="av" style="width:${z}px;height:${z}px;font-size:${z/2.4}px;${o.photo?'':`background:hsl(${hue(o.name||o.phone)},55%,45%)`}">${o.photo?`<img src="${o.photo}">`:E((o.name||'?')[0].toUpperCase())}${dot&&online(o.phone)?'<span class="on-dot"></span>':''}</div>`;
const pres=()=>{try{return JSON.parse(localStorage.getItem('chatx_pres'))||{}}catch(e){return{}}};const online=p=>{const u=U(p);return u.hideSeen?false:Date.now()-(pres()[p]||0)<20000};
const ago=t=>{const d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
const seen=p=>{const u=U(p);if(u.hideSeen)return'';if(online(p))return'online';const t=pres()[p];return t?'last seen '+ago(t):''};
const cid=(a,b)=>[a,b].sort().join('|'),oth=c=>c.members.find(x=>x!=me),nm=c=>c.type=='g'?c.name:U(oth(c)).name,pic=c=>c.type=='g'?{name:c.name,photo:c.photo}:U(oth(c));
const myChats=()=>Object.values(db.chats).filter(c=>c.members.includes(me)).sort((a,b)=>(b.msgs.at(-1)?.t||b.t)-(a.msgs.at(-1)?.t||a.t));
const vis=c=>c.msgs.filter(m=>!(db.users[me].blocked||[]).includes(m.from));
const pv=m=>!m?'No messages yet':m.del?'🚫 Message deleted':m.file?({img:'📷 Photo',vid:'🎥 Video',aud:'🎤 Voice message',doc:'📄 '+E(m.file.name)})[m.file.k]:E(m.text);
/* ---------- AUTH ---------- */
let au={s:'phone'},code;
function authUI(){const a=$('#auth');a.style.display='flex';let h='';
if(au.s=='phone')h=`<div class="logo"><i>✦</i>CHATX</div><p style="color:var(--tx2)">Fast, private messaging.<br>Enter your mobile number.</p><div class="gap"><div style="display:flex;gap:6px">${ccSel('pcc')}<input id="ph" type="tel" placeholder="Mobile number" value="${E(au.p||'')}"></div><button class="btn" style="width:100%" onclick="sendOtp()">Send code</button></div>`;
if(au.s=='otp')h=`<div class="logo"><i>✦</i>CHATX</div><p style="color:var(--tx2)">Enter the 6-digit code sent to ${E(au.p)}</p><div class="gap"><input id="otp" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;font-size:22px;letter-spacing:6px"><button class="btn" style="width:100%" onclick="verify()">Verify</button><button class="btn s" style="width:100%" onclick="au={s:'phone',p:au.p};authUI()">Change number</button></div>`;
if(au.s=='prof')h=`<h3>Set up your profile</h3><div class="gap"><div onclick="$('#pf').click()" style="cursor:pointer;display:flex;justify-content:center">${av({name:au.name||'+',photo:au.photo},90)}</div><input type="file" id="pf" accept="image/*" hidden onchange="pickPhoto(this)"><input id="nn" placeholder="Username" maxlength="30" value="${E(au.name||'')}"><input id="bb" placeholder="Bio" maxlength="80" value="Hey there! I am using CHATX"><button class="btn" style="width:100%" onclick="finish()">Get started</button></div>`;
a.innerHTML=`<div class="card">${h}</div>`}
function sendOtp(){const r=$('#ph').value.replace(/[\s()-]/g,'');let p=r.startsWith('+')?'+'+dg(r):$('#pcc').value+dg(r).replace(/^0+/,'');if(!/^\+\d{8,15}$/.test(p))return toast('Enter a valid mobile number');const ex=Object.values(db.users).find(u=>dg(u.phone)==dg(p));if(ex)p=ex.phone;if(db.users[p]?.banned)return toast('This account has been suspended');
if(!db.users[p]&&db.cfg.signups===false)return toast('Sign ups are currently closed');code=String(Math.floor(1e5+Math.random()*9e5));au={s:'otp',p};authUI();toast('Demo SMS code: '+code+'  (connect Firebase Auth for real SMS)')}
function verify(){if($('#otp').value!=code)return toast('Incorrect code. Try again.');if(db.users[au.p])return login(au.p);au.s='prof';authUI()}
function pickPhoto(i){shrink(i.files[0],200).then(d=>{au.name=$('#nn').value;au.photo=d;authUI()}).catch(()=>toast('Could not read image'))}
function shrink(f,mx){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};i.src=r.result};r.readAsDataURL(f)})}
function finish(){const n=$('#nn').value.trim();if(!n)return toast('Please choose a username');db.users[au.p]={phone:au.p,name:n,bio:$('#bb').value,photo:au.photo||'',blocked:[],contacts:[],admin:!Object.keys(db.users).length,priv:'all',made:Date.now()};save();login(au.p)}
function login(p){me=p;try{sessionStorage.setItem('chatx_me',p)}catch(e){}$('#auth').style.display='none';$('#app').hidden=false;theme();beat();ack();ui()}
function logout(){try{sessionStorage.removeItem('chatx_me')}catch(e){}location.reload()}
const beat=()=>{if(!me)return;const p=pres();p[me]=Date.now();try{localStorage.setItem('chatx_pres',JSON.stringify(p))}catch(e){}};setInterval(()=>{beat();if(me&&tab=='chats')ui(1);if(open)head()},8000);
addEventListener('beforeunload',()=>{if(me){const p=pres();p[me]=Date.now()-25000;try{localStorage.setItem('chatx_pres',JSON.stringify(p))}catch(e){}}});
function theme(){const t=db.users[me]?.theme;if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
/* ---------- SIDE PANES ---------- */
function ui(soft){if(!me||!db.users[me])return;const T=[['chats','💬','Chats'],['contacts','👤','Contacts'],['updates','◉','Updates'],['calls','📞','Calls'],['comm','👥','Communities'],['set','⚙','Settings']];
$('#nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';q='';ui()"><b>${t[1]}</b>${t[2]}</button>`).join('');$('#fab').style.display=tab=='chats'||tab=='comm'||tab=='contacts'?'block':'none';
const p=$('#pane'),sc=p.scrollTop;p.innerHTML=({chats:pChats,contacts:pContacts,updates:pUpd,calls:pCalls,comm:pComm,set:pSet})[tab]();p.scrollTop=sc;if(open&&!soft)chatRender();else if(open)chatRender()}
function pChats(){const L=myChats().filter(c=>nm(c).toLowerCase().includes(q.toLowerCase()));
return`<div class="sr"><input placeholder="Search chats" value="${E(q)}" oninput="q=this.value;ui();this.focus()" id="qs"></div>`+(L.length?L.map(c=>{const ms=vis(c),l=ms.at(-1),un=ms.filter(m=>m.from!=me&&m.st?.[me]!='r').length,o=pic(c);return`<div class="row ${open==c.id?'on':''}" onclick="openChat('${c.id}')">${av(o,50,c.type=='dm')}<div class="m"><div class="n"><span>${E(nm(c))}</span><small>${l?ago(l.t):''}</small></div><div class="p"><span>${l&&l.from==me?'You: ':''}${pv(l)}</span>${un&&open!=c.id?`<span class="bd">${un}</span>`:''}</div></div></div>`}).join(''):`<div class="emp"><b>💬</b>No chats yet.<br>Tap + to find people or start a group.</div>`)}
function pUpd(){const now=Date.now(),L=db.status.filter(s=>now-s.t<864e5&&canSee(s)),mine=L.filter(s=>s.by==me),by={};L.filter(s=>s.by!=me).forEach(s=>(by[s.by]=by[s.by]||[]).push(s));
return`<div class="row" onclick="${mine.length?`viewSt('${me}')`:'addSt()'}">${av(U(me),50)}<div class="m"><div class="n">My status</div><div class="p">${mine.length?mine.length+' update(s) · expires in 24h':'Tap to add a status'}</div></div><button class="ic" onclick="event.stopPropagation();addSt()">＋</button></div><div class="sec">Recent updates</div>`+(Object.keys(by).length?Object.keys(by).map(p=>`<div class="row" onclick="viewSt('${p}')"><div class="ring" style="border-radius:50%">${av(U(p),46)}</div><div class="m"><div class="n">${E(U(p).name)}</div><div class="p">${ago(by[p].at(-1).t)}</div></div></div>`).join(''):`<div class="emp"><b>◉</b>No updates from contacts right now.</div>`)}
const canSee=s=>{if(s.by==me)return 1;const u=U(s.by);if((u.blocked||[]).includes(me)||(U(me).blocked||[]).includes(s.by))return 0;return u.priv=='all'||(u.priv=='contacts'&&(u.contacts||[]).includes(me))};

function postSt(s){if(s.k=='txt'&&!s.text)return toast('Write something first');db.status.push({id:uid(),by:me,t:Date.now(),...s});save();mod();toast('Status posted for 24 hours');ui()}
let sq=[],si=0;function viewSt(p){sq=db.status.filter(s=>s.by==p&&Date.now()-s.t<864e5&&canSee(s));si=0;if(sq.length)showSt()}
function showSt(){const v=$('#stv'),s=sq[si];if(!s){v.style.display='none';v.innerHTML='';return}v.style.display='flex';v.style.background=s.k=='txt'?s.bg:'#000';v.innerHTML=(s.k=='txt'?E(s.text):s.k=='img'?`<img src="${s.d}">`:`<video src="${s.d}" autoplay controls onclick="event.stopPropagation()"></video>`)+`<div style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;font-size:14px;display:flex;gap:8px;align-items:center">${av(U(s.by),32)}${E(U(s.by).name)} · ${ago(s.t)}</div>`}
const nextSt=()=>{si++;showSt()};
/* ---------- CALLS (WebRTC, signalling over BroadcastChannel) ---------- */
const bc=new BroadcastChannel('chatx-sig');let pc,ls,cs=null,ring;
const dial=(p,v)=>{const id=cid(me,p);if(!db.chats[id]){db.chats[id]={id,type:'dm',members:[me,p],msgs:[],t:Date.now()};save()}open=id;startCall(p,v)};
const waitIce=()=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r();setTimeout(r,2500)});
function mkPc(){pc=new RTCPeerConnection();pc.ontrack=e=>{$('#rv').srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(pc&&pc.connectionState=='connected'){cs.t0=Date.now();$('#cs').textContent='Connected';clearTimeout(cs.to)}if(pc&&['failed','closed','disconnected'].includes(pc.connectionState))hang()}}
function callUI(name,photo,status,btns){$('#call').style.display='flex';$('#cav').innerHTML=photo.photo?`<img src="${photo.photo}">`:E((name||'?')[0]);$('#cn').textContent=name;$('#cs').textContent=status;$('#cbt').innerHTML=btns}
async function startCall(to,video){if(!isFinite(window.RTCPeerConnection?1:NaN))return toast('Calls are not supported in this browser');const c=db.chats[open];if(c.type=='g')return toast('Group calls are not available yet');to=to||oth(c);if(cs)return;
if((U(to).blocked||[]).includes(me))return toast('Call could not be placed');try{ls=await navigator.mediaDevices.getUserMedia({audio:true,video})}catch(e){return toast('Allow microphone'+(video?'/camera':'')+' access to call')}
cs={to,video,id:uid(),dir:'out',on:1,t:Date.now()};mkPc();ls.getTracks().forEach(t=>pc.addTrack(t,ls));$('#lv').srcObject=ls;$('#lv').style.display=video?'block':'none';await pc.setLocalDescription(await pc.createOffer());callUI(U(to).name,U(to),'Calling…',ctl());await waitIce();
bc.postMessage({t:'offer',to,from:me,video,id:cs.id,sdp:pc.localDescription});cs.to=setTimeout(()=>{if(cs&&!cs.t0)hang(1)},30000)}
const ctl=()=>`<button onclick="mute(this)">🎤</button><button class="red" onclick="hang()">✕</button><button onclick="spk(this)">🔊</button>`;
const mute=b=>{const t=ls?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;b.textContent=t.enabled?'🎤':'🔇'}};const spk=b=>{const v=$('#rv');v.volume=v.volume>.5?.3:1;b.textContent=v.volume>.5?'🔊':'🔉'};
function hang(miss){if(!cs)return;const c=cs;cs=null;clearTimeout(c.to);clearInterval(ring);try{pc&&pc.close()}catch(e){}pc=null;ls?.getTracks().forEach(t=>t.stop());ls=null;$('#rv').srcObject=null;$('#call').style.display='none';
if(c.on)bc.postMessage({t:'end',to:c.to||c.from,from:me,id:c.id});if(c.dir=='out'){db.calls.push({id:c.id,a:me,b:c.to,video:c.video,t:c.t,res:c.t0?'done':c.declined?'declined':'missed',dur:c.t0?Math.round((Date.now()-c.t0)/1e3):0});save();ui()}}
bc.onmessage=async({data:d})=>{if(d.to!=me)return;
if(d.t=='offer'){if(cs){return bc.postMessage({t:'end',to:d.from,from:me,id:d.id})}if(db.users[me].blocked?.includes(d.from))return;cs={from:d.from,id:d.id,video:d.video,dir:'in',sdp:d.sdp,on:1};if(document.hidden&&Notification?.permission=='granted')new Notification('CHATX call from '+U(d.from).name);
callUI(U(d.from).name,U(d.from),'Incoming '+(d.video?'video':'audio')+' call…',`<button class="red" onclick="decline()">✕</button><button class="grn" onclick="accept()">📞</button>`);let n=0;ring=setInterval(()=>{n++;try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=480;o.start();o.stop(a.currentTime+.3)}catch(e){}},1500)}
if(d.t=='answer'&&cs&&cs.id==d.id){await pc.setRemoteDescription(d.sdp)}
if(d.t=='end'&&cs&&cs.id==d.id){if(cs.dir=='out'&&d.declined)cs.declined=1;cs.on=0;hang()}};
const decline=()=>{bc.postMessage({t:'end',to:cs.from,from:me,id:cs.id,declined:1});cs.on=0;hang()};
async function accept(){clearInterval(ring);const c=cs;try{ls=await navigator.mediaDevices.getUserMedia({audio:true,video:c.video})}catch(e){toast('Allow microphone access to answer');return decline()}mkPc();ls.getTracks().forEach(t=>pc.addTrack(t,ls));$('#lv').srcObject=ls;$('#lv').style.display=c.video?'block':'none';await pc.setRemoteDescription(c.sdp);await pc.setLocalDescription(await pc.createAnswer());await waitIce();bc.postMessage({t:'answer',to:c.from,from:me,id:c.id,sdp:pc.localDescription});$('#cs').textContent='Connecting…';$('#cbt').innerHTML=ctl();c.t0=Date.now()}
/* ---------- CONTACTS ---------- */
const CC=[['+91','🇮🇳'],['+1','🇺🇸'],['+44','🇬🇧'],['+61','🇦🇺'],['+971','🇦🇪'],['+92','🇵🇰'],['+880','🇧🇩'],['+94','🇱🇰'],['+977','🇳🇵'],['+65','🇸🇬'],['+49','🇩🇪'],['+33','🇫🇷'],['+81','🇯🇵'],['+86','🇨🇳'],['+55','🇧🇷'],['+234','🇳🇬'],['+27','🇿🇦']];
const ccSel=(id,v='+91')=>`<select id="${id}" style="width:auto;flex:none">${CC.map(c=>`<option value="${c[0]}" ${c[0]==v?'selected':''}>${c[1]} ${c[0]}</option>`).join('')}</select>`;
const dg=s=>String(s).replace(/\D/g,''),saved=()=>db.users[me]?.saved||[],findU=d=>Object.values(db.users).find(u=>dg(u.phone)==d&&!u.banned);
const known=p=>{const d=dg(p);return saved().some(s=>dg(s.p)==d)||(db.users[me].contacts||[]).includes(p)||!!db.chats[cid(me,p)]};
const qin=v=>{q=v;ui();const e=$('#cq');if(e){e.focus();e.setSelectionRange(99,99)}};
function pContacts(){const s=saved().filter(c=>(c.name+c.p).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
return `<div class="sr" style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="contactForm()">＋ New Contact</button><button class="btn s" style="flex:1" onclick="newChat()">💬 New Chat</button></div><div class="sr"><input id="cq" placeholder="Search saved contacts or number" value="${E(q)}" oninput="qin(this.value)"></div><div class="row" onclick="syncC()"><div class="m">📲 Sync phone contacts<br><small>Optional · asks your permission first</small></div></div><div class="sec">Saved contacts (${saved().length})</div>`+(s.length?s.map(c=>{const u=findU(dg(c.p));return `<div class="row" onclick="cInfo('${c.id}')">${av(u||{name:c.name},44,!!u)}<div class="m"><div class="n"><span>${E(c.name)}</span></div><div class="p"><span>${E(c.p)}</span>${u?'<span style="color:var(--g)">On CHATX</span>':''}</div></div></div>`}).join(''):`<div class="emp"><b>👤</b>No saved contacts yet.<br>Tap New Contact to save a number.</div>`)}
function contactForm(id,cc,num){const c=id?saved().find(x=>x.id==id):null;let k=cc||'+91',n=num||'';if(c){k=(CC.map(x=>x[0]).sort((a,b)=>b.length-a.length).find(x=>c.p.startsWith(x)))||'+91';n=c.p.slice(k.length)}
mod(`<h3>${c?'Edit contact':'Save contact'}</h3><div class="gap"><input id="cfn" placeholder="Contact name" maxlength="40" value="${E(c?.name||'')}"><div style="display:flex;gap:6px">${ccSel('cfc',k)}<input id="cfp" type="tel" placeholder="Mobile number" value="${E(n)}"></div><button class="btn" style="width:100%" onclick="saveC('${id||''}')">Save Contact</button></div>`)}
function saveC(id){const name=$('#cfn').value.trim(),cc=$('#cfc').value,num=dg($('#cfp').value).replace(/^0+/,'');if(!name)return toast('Enter a contact name');if(num.length<6||num.length>13)return toast('Enter a valid mobile number');const p=cc+num,d=dg(p);if(d==dg(me))return toast('That is your own number');const L=db.users[me].saved=db.users[me].saved||[];if(L.some(c=>dg(c.p)==d&&c.id!=id))return toast('This number is already saved');if(id){Object.assign(L.find(x=>x.id==id),{name,p})}else L.push({id:uid(),name,p});save();mod();toast('Contact saved');ui()}
function cInfo(id){const c=saved().find(x=>x.id==id);if(!c)return;const u=findU(dg(c.p));mod(`<div class="gap" style="text-align:center"><div style="display:flex;justify-content:center">${av(u||{name:c.name},90)}</div><h3 style="margin:0">${E(c.name)}</h3><div>${E(c.p)}</div>${u?`<div style="color:var(--tx2)">${E(u.bio||'')}</div><small>${E(seen(u.phone))}</small><button class="btn" style="width:100%" onclick="startDM('${u.phone}')">💬 Start Chat</button>`:'<div style="color:var(--tx2)">This user is not on CHATX yet.</div>'}<div style="display:flex;gap:8px"><button class="btn s" style="flex:1" onclick="contactForm('${id}')">Edit</button><button class="btn d" style="flex:1" onclick="delC('${id}')">Delete</button></div></div>`)}
function delC(id){db.users[me].saved=saved().filter(c=>c.id!=id);save();mod();toast('Contact deleted');ui()}
function newChat2(){const s=saved().map(c=>({c,u:findU(dg(c.p))})).filter(x=>x.u);mod(`<h3>New chat</h3><div class="gap"><div style="display:flex;gap:6px">${ccSel('ncc')}<input id="nnum" type="tel" placeholder="Mobile number" onkeydown="if(event.key=='Enter')lookup()"></div><button class="btn" style="width:100%" onclick="lookup()">🔍 Search number</button><div id="lr"></div><button class="btn s" style="width:100%" onclick="newChat(1)">👥 New group</button></div>${s.length?`<div class="sec">Your registered contacts</div>${s.map(x=>`<div class="row" onclick="startDM('${x.u.phone}')">${av(x.u,40,1)}<div class="m"><div class="n">${E(x.c.name)}</div><small>${E(x.u.bio||'')}</small></div></div>`).join('')}`:''}`)}
function lookup(){const num=dg($('#nnum').value).replace(/^0+/,''),cc=$('#ncc').value,r=$('#lr');if(num.length<6)return toast('Enter a valid mobile number');const d=dg(cc+num);if(d==dg(me)){r.innerHTML='<div class="emp" style="padding:12px">That is your own number.</div>';return}const u=findU(d),sv=saved().some(c=>dg(c.p)==d);
r.innerHTML=u?`<div class="row" style="background:var(--bg2);border-radius:14px;cursor:default">${av(u,56,1)}<div class="m"><div class="n">${E(u.name)}</div><div class="p">${E(u.bio||'')}</div><small>${E(seen(u.phone))}</small></div></div><button class="btn" style="width:100%;margin-top:8px" onclick="startDM('${u.phone}')">💬 Start Chat</button>${sv?'':`<button class="btn s" style="width:100%;margin-top:8px" onclick="contactForm(0,'${cc}','${num}')">＋ Save contact</button>`}`:`<div class="emp" style="padding:14px"><b>🔍</b>This user is not on CHATX yet.</div>${sv?'':`<button class="btn s" style="width:100%" onclick="contactForm(0,'${cc}','${num}')">Save number as contact</button>`}`}
function syncC(){mod(`<h3>Sync phone contacts</h3><p style="color:var(--tx2)">CHATX only reads contacts you choose to share. Numbers are matched against registered CHATX accounts, and nothing is uploaded without your permission.</p><div class="gap"><button class="btn" style="width:100%" onclick="pick()">Allow &amp; choose contacts</button><button class="btn s" style="width:100%" onclick="$('#vf').click()">Import a .vcf file instead</button><input type="file" id="vf" accept=".vcf,text/vcard" hidden onchange="vcf(this)"><button class="btn s" style="width:100%" onclick="mod()">Not now</button></div>`)}
async function pick(){if(!navigator.contacts||!navigator.contacts.select)return toast('Contact picker is not supported here. Import a .vcf file instead.');try{const r=await navigator.contacts.select(['name','tel'],{multiple:true});mergeC(r.flatMap(c=>(c.tel||[]).map(t=>({name:(c.name||[])[0]||'',tel:t}))))}catch(e){toast('Contacts access was cancelled')}}
function vcf(i){const f=i.files[0];i.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const L=[];let n='';String(r.result).split(/\r?\n/).forEach(l=>{if(/^FN/i.test(l))n=l.split(':').slice(1).join(':').trim();else if(/^TEL/i.test(l))L.push({name:n,tel:l.split(':').pop().trim()})});mergeC(L)};r.onerror=()=>toast('Could not read file');r.readAsText(f)}
function mergeC(L){const own=(CC.find(c=>me.startsWith(c[0]))||['+91'])[0],S=db.users[me].saved=db.users[me].saved||[];let add=0;L.forEach(x=>{const t=String(x.tel).replace(/[\s()-]/g,''),d=dg(t.startsWith('+')?t:own+dg(t).replace(/^0+/,'')),u=findU(d);if(!u||d==dg(me)||S.some(c=>dg(c.p)==d))return;S.push({id:uid(),name:x.name||u.name,p:'+'+d});add++});save();mod();toast(add?add+' registered contact(s) added':'No new registered contacts found');ui()}
/* ---------- ADMIN ---------- */
function admin(){const us=Object.values(db.users),size=(localStorage.getItem(K)||'').length;mod(`<h3>🛡 Admin panel</h3><div class="sec">App health</div><div class="row"><div class="m">Users ${us.length} · Online ${us.filter(u=>online(u.phone)).length} · Chats ${Object.keys(db.chats).length}<br><small>Messages ${Object.values(db.chats).reduce((a,c)=>a+c.msgs.length,0)} · Storage ${(size/1024).toFixed(0)} KB of ~5000 KB</small></div></div><div class="row" onclick="db.cfg.signups=db.cfg.signups===false;save();admin()"><div class="m">Allow new sign ups</div><div class="tg ${db.cfg.signups!==false?'on':''}"></div></div>
<div class="sec">Reports (${db.reports.length})</div>${db.reports.length?db.reports.map(r=>`<div class="row"><div class="m"><b>${E(U(r.on).name)}</b> · ${E(r.why)}<br><small>by ${E(U(r.by).name)} · ${ago(r.t)}</small></div><button class="btn s" onclick="ban('${r.on}')">${U(r.on).banned?'Unban':'Ban'}</button><button class="ic" onclick="db.reports=db.reports.filter(x=>x.id!='${r.id}');save();admin()">✕</button></div>`).join(''):'<div class="emp">No reports 🎉</div>'}<div class="sec">Users</div>${us.map(u=>`<div class="row">${av(u,36)}<div class="m">${E(u.name)}<br><small>${E(u.phone)}${u.admin?' · admin':''}</small></div>${u.admin?'':`<button class="btn s" onclick="ban('${u.phone}')">${u.banned?'Unban':'Block'}</button>`}</div>`).join('')}`)}
const ban=p=>{db.users[p].banned=!db.users[p].banned;save();admin()};
/* ---------- SYNC ---------- */
function ack(){if(!me||!db.users[me])return;let ch=0;const u=db.users[me],bl=u.blocked||[];for(const c of Object.values(db.chats)){if(!c.members.includes(me))continue;for(const m of c.msgs){if(m.from==me||m.from=='sys'||bl.includes(m.from))continue;m.st=m.st||{};if(!m.st[me]){m.st[me]='d';ch=1}if(open==c.id&&!document.hidden&&!u.noRR&&m.st[me]!='r'){m.st[me]='r';ch=1}}}if(ch)save()}
const counts=()=>Object.values(db.chats).filter(c=>me&&c.members.includes(me)).reduce((a,c)=>(a[c.id]=c.msgs.length,a),{});let prev={};
addEventListener('storage',e=>{if(e.key==K){try{db=JSON.parse(e.newValue)}catch(x){return}if(!me)return;if(me&&!db.users[me]){return logout()}if(db.users[me].banned){toast('Your account was suspended');return logout()}const n=counts();Object.keys(n).forEach(id=>{if(n[id]>(prev[id]??n[id])){const m=db.chats[id].msgs.at(-1);if(m.from!=me&&m.from!='sys'&&document.hidden&&db.users[me].notif!==false&&window.Notification&&Notification.permission=='granted')new Notification(U(m.from).name,{body:m.text||'New message'})}});ack();ui(1);prev=counts();theme()}else if(e.key=='chatx_typ'&&open)head()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ack();if(open)chatRender()}});prev=counts();
if(me&&db.users[me])login(me);else{me=null;authUI()}
</script></body></html>
